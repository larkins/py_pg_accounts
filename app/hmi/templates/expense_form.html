{% extends "base.html" %}

{% block title %}{{ 'Edit Expense' if expense else 'New Expense' }} - Accounting System{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ 'Edit Expense' if expense else 'New Expense' }}</h2>

    <form method="POST">
        <div class="form-group">
            <label for="vendor_name">Vendor Name *</label>
            <input type="text" id="vendor_name" name="vendor_name" required value="{{ vendor_name or (expense.vendor_name if expense) }}">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ description or (expense.description if expense) }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="ex_gst_amount">Ex-GST Amount *</label>
                <input type="number" id="ex_gst_amount" name="ex_gst_amount" step="0.01" min="0" required value="{{ ex_gst_amount or (expense.ex_gst_amount|string if expense) }}">
            </div>
            <div class="form-group">
                <label for="gst_type">GST Type</label>
                <select id="gst_type" name="gst_type">
                    <option value="0" {% if (gst_type or expense.gst_type|string if expense) == '0' %}selected{% endif %}>No GST (0%)</option>
                    <option value="0.1" {% if (gst_type or expense.gst_type|string if expense) == '0.1' %}selected{% endif %}>GST (10%)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="expense_date">Expense Date *</label>
                <input type="date" id="expense_date" name="expense_date" required value="{{ expense_date or (expense.expense_date.strftime('%Y-%m-%d') if expense) }}">
            </div>
            <div class="form-group">
                <label for="account_category_id">Account Category</label>
                <select id="account_category_id" name="account_category_id">
                    <option value="">-- Select Category --</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}" {% if (account_category_id or expense.account_category_id) == category.id %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>New Account Category</label>
            <input type="text" name="new_category_name" placeholder="Enter new category name (optional)">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">{{ 'Update' if expense else 'Create' }}</button>
            <a href="{{ url_for('hmi.expenses') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
